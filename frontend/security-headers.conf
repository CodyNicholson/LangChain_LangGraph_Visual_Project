# Included at server level AND in every location that has its own add_header: nginx drops the
# inherited add_header directives as soon as a location declares one.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Everything is served from this origin; the API is proxied under /api/. Angular adds component styles
# as <style> elements at runtime, so style-src needs 'unsafe-inline' (scripts stay 'self' only). The router
# needs <base href="/">, so base-uri is 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
